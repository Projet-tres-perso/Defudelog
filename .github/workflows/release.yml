name: "publish"
on:
  push:
    branches:
      - main # Déclenche le build lors d'un push sur la branche main

jobs:
  publish-tauri:
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 60 # fastembed/ONNX Runtime peut prendre du temps à compiler

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest" # Lance une machine Windows virtuelle

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev

      - name: install frontend dependencies
        run: npm install

      - name: Install Npcap SDK (Windows only)
        if: matrix.platform == 'windows-latest'
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile "npcap-sdk.zip"
          Expand-Archive -Path "npcap-sdk.zip" -DestinationPath "C:\npcap-sdk"
          echo "LIB=$env:LIB;C:\npcap-sdk\Lib\x64" >> $env:GITHUB_ENV

      - name: Install OpenSSL (Windows only)
        if: matrix.platform == 'windows-latest'
        run: |
          choco install openssl --x64 -y
          # Détecter le répertoire d'installation (varie selon la version de choco/openssl)
          $candidates = @(
            "C:\Program Files\OpenSSL",
            "C:\Program Files\OpenSSL-Win64"
          )
          $opensslDir = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $opensslDir) { throw "OpenSSL installation directory not found" }
          echo "OpenSSL found at: $opensslDir"

          # Lister tout le contenu pour le debug
          echo "=== Full OpenSSL directory tree (lib) ==="
          Get-ChildItem -Path "$opensslDir\lib" -Recurse -Filter "*.lib" | ForEach-Object { echo $_.FullName }

          # Chercher libcrypto*.lib dans tout le répertoire OpenSSL
          $cryptoLib = Get-ChildItem -Path "$opensslDir" -Recurse -Filter "libcrypto*.lib" | Select-Object -First 1
          if (-not $cryptoLib) { throw "libcrypto*.lib not found anywhere in $opensslDir" }
          $libDir = $cryptoLib.DirectoryName
          echo "Found crypto lib: $($cryptoLib.FullName)"

          # Si le fichier ne s'appelle pas exactement libcrypto.lib, créer une copie
          if ($cryptoLib.Name -ne "libcrypto.lib") {
            Copy-Item $cryptoLib.FullName "$libDir\libcrypto.lib"
            echo "Created copy: $libDir\libcrypto.lib"
          }
          # Idem pour libssl
          $sslLib = Get-ChildItem -Path $libDir -Filter "libssl*.lib" | Select-Object -First 1
          if ($sslLib -and $sslLib.Name -ne "libssl.lib") {
            Copy-Item $sslLib.FullName "$libDir\libssl.lib"
            echo "Created copy: $libDir\libssl.lib"
          }

          echo "OPENSSL_LIB_DIR=$libDir" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$opensslDir\include" >> $env:GITHUB_ENV
          echo "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
          # Ajouter au LIB pour que le linker MSVC trouve libcrypto.lib et libssl.lib
          echo "LIB=$env:LIB;$libDir" >> $env:GITHUB_ENV
          echo "=== Final lib dir contents ==="
          Get-ChildItem $libDir -Filter "*.lib" | ForEach-Object { echo $_.Name }

      - name: Build and Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__ # Crée automatiquement un tag Git
          releaseName: "DeFuDoLog v__VERSION__"
          releaseBody: "Release officielle de DeFuDoLog v__VERSION__. Téléchargez l'installeur correspondant à votre système ci-dessous."
          releaseDraft: true
          prerelease: false

      - name: Upload Build Artifacts (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defudolog-binaries-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
