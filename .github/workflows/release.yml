name: "publish"
on:
  push:
    branches:
      - main # Déclenche le build lors d'un push sur la branche main

jobs:
  publish-tauri:
    permissions:
      contents: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest" # Lance une machine Windows virtuelle

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: install frontend dependencies
        run: npm install # Ajustez selon votre gestionnaire (yarn install, pnpm install)

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__ # Crée automatiquement un tag Git
          releaseName: "App v__VERSION__"
          releaseBody: "Voir les fichiers d'installation ci-dessous."
          releaseDraft: true
          prerelease: false
