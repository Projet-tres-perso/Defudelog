name: "publish"
on:
  push:
    branches:
      - main # Déclenche le build lors d'un push sur la branche main

jobs:
  publish-tauri:
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 60 # fastembed/ONNX Runtime peut prendre du temps à compiler

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest" # Lance une machine Windows virtuelle

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev

      - name: install frontend dependencies
        run: npm install

      - name: Install Npcap SDK (Windows only)
        if: matrix.platform == 'windows-latest'
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile "npcap-sdk.zip"
          Expand-Archive -Path "npcap-sdk.zip" -DestinationPath "C:\npcap-sdk"
          echo "LIB=$env:LIB;C:\npcap-sdk\Lib\x64" >> $env:GITHUB_ENV

      - name: Install OpenSSL (Windows only)
        if: matrix.platform == 'windows-latest'
        run: |
          choco install openssl --x64 -y
          echo "OPENSSL_DIR=C:\Program Files\OpenSSL-Win64" >> $env:GITHUB_ENV

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__ # Crée automatiquement un tag Git
          releaseName: "App v__VERSION__"
          releaseBody: "Voir les fichiers d'installation ci-dessous."
          releaseDraft: true
          prerelease: false
